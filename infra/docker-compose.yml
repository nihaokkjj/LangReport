services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: langreport
      POSTGRES_PASSWORD: langreport
      POSTGRES_DB: langreport
    volumes:
      - langreport-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langreport -d langreport"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: langreport
      MINIO_ROOT_PASSWORD: langreport-dev-secret
    volumes:
      - langreport-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 langreport langreport-dev-secret; do sleep 1; done;
        mc mb --ignore-existing local/langreport

volumes:
  langreport-postgres:
  langreport-minio:
